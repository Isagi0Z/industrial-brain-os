services:
  # 1. PostgreSQL - Core relational metadata
  postgres:
    image: postgres:16-alpine
    container_name: ib_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-industrial_brain}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-industrial_brain}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Neo4j - Knowledge Graph Database
  neo4j:
    image: neo4j:5.19-community
    container_name: ib_neo4j
    restart: unless-stopped
    ports:
      - "${NEO4J_PORT:-7474}:7474"      # HTTP Console
      - "${NEO4J_BOLT_PORT:-7687}:7687" # Bolt protocol
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4j_dev_password}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: 'apoc.*'
      NEO4J_dbms_security_procedures_allowlist: 'apoc.*'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Qdrant - High-performance Vector Database
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: ib_qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:6333/readyz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 4. Redis - Cache and Session Store
  redis:
    image: redis:7.2-alpine
    container_name: ib_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_dev_password}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-redis_dev_password} ping | grep PONG || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 5. MinIO - Object Storage for Source Documents
  minio:
    image: minio/minio:latest
    container_name: ib_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_password}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 6. Backend API (M15 — image shared with the Celery worker)
  ib_backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: industrial-brain-backend:latest
    container_name: ib_backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    # In-network service hostnames override the host-oriented .env values.
    environment:
      POSTGRES_HOST: postgres
      NEO4J_HOST: neo4j
      QDRANT_HOST: qdrant
      REDIS_HOST: redis
      MINIO_HOST: minio
      # Observability (M17, ADR-016): export traces to the in-network Jaeger.
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: industrial-brain-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      - postgres
      - redis
      - neo4j
      - qdrant
      - minio
      - jaeger

  # 7. Celery ingestion worker (M15, ADR-015) — same image as the backend,
  #    running the async ingestion task chain (parse → embed → kg).
  ib_worker:
    image: industrial-brain-backend:latest
    container_name: ib_worker
    restart: unless-stopped
    command: celery -A app.worker worker --loglevel=info --concurrency=${CELERY_WORKER_CONCURRENCY:-2}
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      NEO4J_HOST: neo4j
      QDRANT_HOST: qdrant
      REDIS_HOST: redis
      MINIO_HOST: minio
      # Ingestion task spans join the same Jaeger backend (M17, ADR-016).
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: industrial-brain-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      - ib_backend
      - postgres
      - redis
      - neo4j
      - qdrant
      - minio
      - jaeger

  # 8. Jaeger — distributed tracing backend (M17, ADR-016). Receives OTLP from
  #    the API + worker and renders end-to-end traces at the UI on 16686.
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: ib_jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"   # Jaeger UI
      - "${JAEGER_OTLP_GRPC_PORT:-4317}:4317"  # OTLP gRPC
      - "${JAEGER_OTLP_HTTP_PORT:-4318}:4318"  # OTLP HTTP

  # 9. Prometheus — metrics collection (M17, ADR-017). Scrapes the API
  #    /metrics endpoint (HTTP, LLM tokens, Celery, evaluation gauges).
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: ib_prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - ib_backend

  # 10. Grafana — dashboards (M17, ADR-017). Pre-provisioned Prometheus +
  #     Jaeger datasources and the API / RAG dashboards; no manual setup.
  grafana:
    image: grafana/grafana:11.0.0
    container_name: ib_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - jaeger

volumes:
  pg_data:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
  qdrant_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:
