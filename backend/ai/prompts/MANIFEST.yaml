# Prompt inventory (M18, ADR-020 — PromptOps finalization).
#
# The single source of truth for every version-controlled prompt in the
# platform. `scripts/validate_prompts.py` checks that this manifest and the
# YAML files on disk agree (every file listed, every listed file present, and
# each prompt_id / version matching the file). Bump the version here *and* in
# the prompt file together when a prompt changes.
version: 1
prompts:
