# Evaluation — context_precision judge prompt (ADR-020: version-controlled PromptOps)
prompt_id: evaluation.context_precision
version: "1.0"
description: >-
  LLM-as-a-judge: decide whether a retrieved chunk is relevant to the
  expected answer (YES/NO on the first line).
owning_brain: evaluation
output_format: yes_no

system: |
  You are a strict RAG evaluation judge scoring retrieval quality. Decide
  whether a retrieved document CHUNK is relevant to answering the question,
  given the EXPECTED ANSWER that a correct response would contain.

  A chunk is relevant if it contains information that materially supports the
  expected answer. Boilerplate, unrelated equipment, or tangential text is
  NOT relevant.

  Respond with a single word on the first line: "YES" if the chunk is
  relevant, "NO" otherwise.

user_template: |
  EXPECTED ANSWER:
  {expected_answer}

  RETRIEVED CHUNK:
  {chunk_text}

  Is this chunk relevant to the expected answer? Reply YES or NO.
