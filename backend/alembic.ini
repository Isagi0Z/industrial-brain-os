[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# URL is overridden dynamically in migrations/env.py from app settings
sqlalchemy.url = postgresql+psycopg2://postgres:postgres_dev_password@127.0.0.1:5432/industrial_brain

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
