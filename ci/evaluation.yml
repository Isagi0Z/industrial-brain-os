name: RAG Evaluation Gate

# M16 — run the golden-dataset evaluation on every PR to main and on merge.
# Fails the build if the hallucination rate exceeds the threshold (0.15),
# per docs/implementation_roadmap.md.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  evaluation:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: industrial_brain
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_dev_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.9.0
        ports: ["6333:6333"]
      neo4j:
        image: neo4j:5.19-community
        env:
          NEO4J_AUTH: neo4j/neo4j_dev_password
        ports: ["7474:7474", "7687:7687"]

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: postgres_dev_password
      REDIS_HOST: localhost
      REDIS_PASSWORD: ""
      NEO4J_HOST: localhost
      NEO4J_PASSWORD: neo4j_dev_password
      QDRANT_HOST: localhost
      LLM_PROVIDER: gemini
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -e shared/python
      - name: Apply migrations
        run: cd backend && alembic upgrade head
      - name: Run RAG evaluation gate
        # Exits non-zero if hallucination_rate > EVAL_HALLUCINATION_THRESHOLD.
        run: python scripts/run_eval.py
