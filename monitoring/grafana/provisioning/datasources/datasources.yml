# Grafana datasource provisioning (M17, ADR-017).
# Auto-configures Prometheus (metrics) and Jaeger (traces) so the dashboards
# work on first `docker compose up` with no manual setup.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false
