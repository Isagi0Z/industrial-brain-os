# Grafana dashboard provisioning (M17, ADR-017).
# Loads every dashboard JSON committed under monitoring/grafana/dashboards/
# (mounted at /var/lib/grafana/dashboards) at startup.
apiVersion: 1

providers:
  - name: industrial-brain
    orgId: 1
    folder: Industrial Brain
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
